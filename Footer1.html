<html>
    <head>
        <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:linear-gradient(to right,#e3f2fd,#ffffff);
}

/* Header */
.header{
    background:linear-gradient(90deg,#4facfe,#00f2fe);
    color:white;
    text-align:center;
    padding:30px;
}

/* Main Content */
.content{
    min-height:400px;
    padding:40px;
    text-align:center;
    background:linear-gradient(135deg,#f6d365,#fda085);
    color:#333;
}

/* Footer */
.footer{
    background:linear-gradient(to right,#141e30,#243b55);
    color:white;
    text-align:center;
    padding:25px;
    font-size:18px;
}

.footer a{
    color:#ffd700;
    text-decoration:none;
    margin:0 10px;
}

.footer a:hover{
    color:white;
}

h1,h2{
    margin-bottom:15px;
}

p{
    line-height:1.8;
    font-size:18px;
}

</style>

    <body>
        <div class="header">
            <h1>My Website</h1>
        </div>
        <div class="content">
            <h2>Welcome!!!</h2>
            <p>
            This is a simple website created using HTML and CSS.
            The footer is displayed at the bottom of the webpage.
        </p>
        </div>
